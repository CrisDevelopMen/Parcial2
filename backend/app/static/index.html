<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Reservas de vuelos</title>
<style>body{font-family:sans-serif;max-width:760px;margin:2em auto}input,button{padding:6px;margin:3px}
table{border-collapse:collapse;width:100%;margin-top:1em}td,th{border:1px solid #ccc;padding:6px}
#booking{margin-top:1em;padding:1em;background:#f4f4f4;display:none}.err{color:#b00}</style></head>
<body>
<h1>Buscar vuelos</h1> <a href="/manager">Panel gerencial</a>
<form id="search-form">
  <input data-testid="search-origin" id="origin" placeholder="Origen (CUC)" required>
  <input data-testid="search-destination" id="destination" placeholder="Destino (PSO)" required>
  <input data-testid="search-date" id="date" type="date" required>
  <button data-testid="search-submit" type="submit">Buscar</button>
</form>
<div id="msg" class="err"></div>
<table><thead><tr><th>Vuelo</th><th>Ruta</th><th>Fecha</th><th>Asientos</th><th>Precio</th><th></th></tr></thead>
<tbody id="results"></tbody></table>
<div id="booking">
  <div>Reservando vuelo <b id="sel-flight"></b></div>
  <input data-testid="passenger-name" id="passenger" placeholder="Nombre del pasajero">
  <select id="fare"><option>ECONOMY</option><option>BUSINESS</option></select>
  <button data-testid="confirm-submit" id="confirm">Confirmar</button>
</div>
<div id="confirmation" style="margin-top:1em"></div>
<script>
const $ = id => document.getElementById(id);
let selected = null;
$('search-form').onsubmit = async e => {
  e.preventDefault(); $('msg').textContent = ''; $('results').innerHTML = '';
  const q = new URLSearchParams({origin: $('origin').value.trim(), destination: $('destination').value.trim(), date: $('date').value});
  const r = await fetch('/flights/search?' + q);
  if (!r.ok) { $('msg').textContent = 'Error ' + r.status; return; }
  const list = await r.json();
  if (!list.length) $('msg').textContent = 'Sin vuelos disponibles';
  for (const f of list) {
    const tr = document.createElement('tr'); tr.dataset.testid = 'flight-row';
    tr.innerHTML = `<td>${f.flight_id}</td><td>${f.route}</td><td>${f.flight_date}</td><td>${f.seats_available}</td>` +
      `<td>$${(f.price_cents/100).toFixed(2)}</td><td><button data-testid="reserve-button">Reservar</button></td>`;
    tr.querySelector('button').onclick = () => { selected = f.flight_id; $('sel-flight').textContent = f.flight_id; $('booking').style.display = 'block'; };
    $('results').appendChild(tr);
  }
};
$('confirm').onclick = async () => {
  const r = await fetch('/reservations', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({flight_id: selected, passenger_name: $('passenger').value.trim(), fare_class: $('fare').value})});
  if (r.status !== 201) { $('confirmation').innerHTML = `<span class="err">No se pudo reservar (${r.status})</span>`; return; }
  const b = await r.json();
  $('confirmation').innerHTML = 'Reserva confirmada: <b data-testid="confirmation-id"></b>';
  $('confirmation').querySelector('b').textContent = b.reservation_id;
};
</script></body></html>
