<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Panel gerencial</title>
<style>body{font-family:sans-serif;max-width:600px;margin:2em auto}input,button{padding:6px;margin:3px}
#out{margin-top:1em;font-size:1.3em}.err{color:#b00}</style></head>
<body>
<h1>Panel gerencial: ocupación</h1> <a href="/">Reservas</a>
<div>
  <input data-testid="manager-route" id="route" placeholder="Ruta (CUC-PSO)">
  <input data-testid="manager-month" id="month" placeholder="Mes (YYYY-MM)">
  <button data-testid="manager-load" id="load">Cargar</button>
</div>
<div id="out">Ocupación: <b data-testid="occupancy-value" id="occ"></b> <span id="detail"></span></div>
<script>
const $ = id => document.getElementById(id);
$('load').onclick = async () => {
  $('occ').textContent = ''; $('detail').textContent = 'consultando Athena...';
  const q = new URLSearchParams({route: $('route').value.trim().toUpperCase(), month: $('month').value.trim()});
  const r = await fetch('/analytics/occupancy?' + q);
  if (!r.ok) { $('detail').innerHTML = `<span class="err">Sin datos (${r.status})</span>`; return; }
  const d = await r.json();
  $('occ').textContent = (d.occupancy * 100).toFixed(2) + '%';
  $('detail').textContent = `(${d.seats_sold} / ${d.seats_capacity} asientos)`;
};
</script></body></html>
