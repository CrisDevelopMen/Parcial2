# Copy to config.yaml and fill it in. Do NOT commit credentials; the harness uses your normal
# AWS credentials (environment variables / ~/.aws), exactly like the AWS CLI.
team_id: "team01"
seed: 417                # the 3-digit seed assigned to your team (changes your events AND the expected answers)

backend:
  base_url: "http://YOUR-EC2-IP:8000"

aws:
  region: us-east-1
  kinesis_stream: airline-events                    # name of YOUR stream
  raw_events_uri: "s3://YOUR-BUCKET/raw/events/"    # landing zone: JSON lines (gzip allowed)
  athena_workgroup: primary                         # must have a per-query data limit (R10)
  athena_database: airline_star
  athena_output: "s3://YOUR-BUCKET/athena-results/" # needed only if your workgroup has no default

cost_projection_file: cost_projection.yaml
